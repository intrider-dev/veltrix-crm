openapi: 3.1.0
info:
  title: Sales CRM API
  version: 0.1.0
  description: Contract for the multi-tenant Sales CRM. Product-facing brand text is supplied by runtime product configuration.
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /health/live:
    get:
      operationId: platformHealthLive
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      operationId: platformHealthReady
      security: []
      responses:
        "200":
          description: Database is reachable and migrations are current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/Problem" }
  /config:
    get:
      operationId: platformConfig
      security: []
      responses:
        "200":
          description: Public product configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
  /auth/login:
    post:
      operationId: identityLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated session and CSRF token cookies have been set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "202":
          description: Password accepted; MFA challenge must be completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAChallenge" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/session:
    get:
      operationId: identityProbeSession
      security: []
      responses:
        "200":
          description: Same-origin browser session probe; unauthenticated is a normal result
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionProbe" }
        "500": { $ref: "#/components/responses/Problem" }
  /auth/register:
    post:
      operationId: identityRegisterDevelopmentUser
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/DevelopmentRegistrationRequest",
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Development user registered,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/RegisteredUser" } },
              },
          }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/mfa/verify:
    post:
      operationId: identityVerifyMFALogin
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MFALoginRequest" } },
            },
        }
      responses:
        "200":
          {
            description: MFA verified and authenticated session set,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SessionView" } },
              },
          }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/password-reset/request:
    post:
      operationId: identityRequestPasswordReset
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/PasswordResetRequest" },
                },
            },
        }
      responses:
        "202":
          { description: Request accepted without revealing account existence }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/password-reset/confirm:
    post:
      operationId: identityConfirmPasswordReset
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PasswordResetConfirmation" },
                },
            },
        }
      responses:
        "204": { description: Password reset and existing sessions revoked }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: identityLogout
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Problem" }
  /me:
    get:
      operationId: identityMe
      responses:
        "200":
          description: Current user and accessible workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: identityUpdatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserPreferences" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
  /me/password:
    put:
      operationId: identityChangePassword
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PasswordChangeRequest" },
                },
            },
        }
      responses:
        "204": { description: Password changed and all sessions revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /me/sessions:
    delete:
      operationId: identityLogoutAllSessions
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: All user sessions revoked }
  /me/mfa:
    get:
      operationId: identityMFAStatus
      responses:
        "200":
          {
            description: MFA status,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/MFAStatus" } },
              },
          }
    post:
      operationId: identityBeginMFASetup
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MFASetupRequest" } },
            },
        }
      responses:
        "200":
          {
            description: One-time TOTP setup secret,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/MFASetup" } },
              },
          }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: identityDisableMFA
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/MFAProtectedRequest" },
                },
            },
        }
      responses:
        "204": { description: MFA disabled and all sessions revoked }
        "401": { $ref: "#/components/responses/Problem" }
  /me/mfa/confirm:
    post:
      operationId: identityConfirmMFASetup
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MFACodeRequest" } },
            },
        }
      responses:
        "200":
          {
            description: MFA enabled and one-time recovery codes returned,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/RecoveryCodes" } },
              },
          }
        "401": { $ref: "#/components/responses/Problem" }
  /me/mfa/recovery-codes:
    post:
      operationId: identityRegenerateRecoveryCodes
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/MFAProtectedRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Previous codes invalidated and new one-time recovery codes returned,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/RecoveryCodes" } },
              },
          }
        "401": { $ref: "#/components/responses/Problem" }
  /workspaces:
    post:
      operationId: tenancyCreateWorkspace
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/CreateWorkspaceRequest" },
                },
            },
        }
      responses:
        "201":
          {
            description: Workspace and owner membership created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/WorkspaceDetails" } },
              },
          }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /invitations/accept:
    post:
      operationId: tenancyAcceptInvitation
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/AcceptInvitationRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Membership created or reactivated,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipMutation" },
                  },
              },
          }
        "404": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/invitations:
    post:
      operationId: tenancyInviteMember
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/InviteMemberRequest" },
                },
            },
        }
      responses:
        "201":
          {
            description: Invitation created; plaintext token is returned once,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/WorkspaceInvitation" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/members:
    get:
      operationId: tenancyListMembers
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          {
            description: Workspace members,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/WorkspaceMember" },
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/members/{membershipId}/role:
    patch:
      operationId: tenancyUpdateMemberRole
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MemberRoleRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Membership role changed,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipMutation" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/members/{membershipId}/role-assignment:
    patch:
      operationId: tenancyAssignWorkspaceRole
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/WorkspaceRoleAssignmentInput" }
      responses:
        "200":
          description: Effective workspace role assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipMutation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/roles:
    get:
      operationId: tenancyListWorkspaceRoles
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: System and custom roles available in the workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceRoleDefinition" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: tenancyCreateWorkspaceRole
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRoleInput" }
      responses:
        "201":
          description: Custom role created
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRoleDefinition" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/roles/{roleId}:
    patch:
      operationId: tenancyUpdateWorkspaceRole
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: roleId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRoleInput" }
      responses:
        "200":
          description: Custom role updated
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRoleDefinition" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: tenancyDeleteWorkspaceRole
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: roleId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Unassigned custom role deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/members/{membershipId}/status:
    patch:
      operationId: tenancyUpdateMemberStatus
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/MemberStatusRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Membership status changed,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipMutation" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/defaults:
    patch:
      operationId: tenancyUpdateWorkspaceDefaults
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/WorkspaceDefaultsRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Workspace defaults changed,
            headers: { ETag: { schema: { type: string } } },
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/WorkspaceDetails" } },
              },
          }
        "412": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/me/locale:
    patch:
      operationId: tenancySetMyWorkspaceLocale
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/WorkspaceLocaleRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Per-workspace locale override changed,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipMutation" },
                  },
              },
          }
  /workspaces/{workspaceId}/departments:
    get:
      operationId: tenancyListDepartments
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Department" }
    post:
      operationId: tenancyCreateDepartment
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDepartmentRequest" }
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }
  /workspaces/{workspaceId}/departments/{teamId}/members:
    get:
      operationId: tenancyListDepartmentMembers
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Department membership list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
  /workspaces/{workspaceId}/departments/{teamId}/members/{membershipId}:
    put:
      operationId: tenancyAddDepartmentMember
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Member added to department }
    delete:
      operationId: tenancyRemoveDepartmentMember
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Member removed from department }
  /workspaces/{workspaceId}/teams:
    get:
      operationId: tenancyListTeams
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          {
            description: Teams,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Team" },
                      },
                  },
              },
          }
    post:
      operationId: tenancyCreateTeam
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateTeamRequest" } },
            },
        }
      responses:
        "201":
          {
            description: Team created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Team" } },
              },
          }
  /workspaces/{workspaceId}/teams/{teamId}/members:
    get:
      operationId: tenancyListTeamMembers
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          {
            description: Team membership list,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/TeamMember" },
                      },
                  },
              },
          }
  /workspaces/{workspaceId}/teams/{teamId}/members/{membershipId}:
    put:
      operationId: tenancyAddTeamMember
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Member added to team }
    delete:
      operationId: tenancyRemoveTeamMember
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: membershipId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Member removed from team }
  /workspaces/{workspaceId}/dashboard:
    get:
      operationId: reportingDashboard
      security: [{ cookieSession: [] }, { bearerAPIKey: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Workspace KPI snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "404": { $ref: "#/components/responses/Problem" }
  /workspaces/{workspaceId}/contacts:
    get:
      operationId: customersListContacts
      security: [{ cookieSession: [] }, { bearerAPIKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/Cursor" }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
      responses:
        "200":
          description: Cursor-paginated contacts
