        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: veltrix_crm_session
      description: Browser session cookie. Production deployments use the __Host- prefix.
    bearerAPIKey:
      type: http
      scheme: bearer
      bearerFormat: crm1 workspace-scoped API key
  parameters:
    WorkspaceId:
      {
        name: workspaceId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ContactId:
      {
        name: contactId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ResourceId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    Cursor:
      { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
      }
    IfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        schema: { type: string, pattern: '^"[0-9]+"$' },
      }
    OptionalIfMatch:
      {
        name: If-Match,
        in: header,
        required: false,
        schema: { type: string, pattern: '^"[0-9]+"$' },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 16, maxLength: 128 },
      }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for unsafe cookie-authenticated requests; validated bearer API keys do not use CSRF.
      schema: { type: string, minLength: 32, maxLength: 256 }
  responses:
    Problem:
      description: RFC Problem Details with stable localizable code
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    MailboxSecurity:
      type: string
      enum: [tls, starttls]
    MailboxAccountInput:
      type: object
      additionalProperties: false
      required:
        [
          displayName,
          email,
          username,
