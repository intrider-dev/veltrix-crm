name: Bug report
description: Report a reproducible product defect without including private CRM data.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Use synthetic data and follow SECURITY.md for vulnerabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find this defect.
          required: true
        - label: This report contains no credentials, tokens, or real customer data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact steps, route, role, workspace setup, and synthetic input.
      placeholder: |
        1. Start from commit ...
        2. Sign in as role ...
        3. Open ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local Go and Angular development
        - Other documented deployment
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker, PostgreSQL, locale, timezone, and relevant resource limits.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add redacted logs, request IDs, screenshots, or traces. Never attach secrets or PII.
