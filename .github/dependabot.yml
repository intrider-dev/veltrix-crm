version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
      ag-grid-community:
        patterns:
          - "ag-grid-angular"
          - "ag-grid-community"
      frontend-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "@angular-eslint/*"

  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "03:35"
      timezone: Etc/UTC
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore(deps-go)"
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:55"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(container)"
    groups:
      container-images:
        patterns: ["*"]
