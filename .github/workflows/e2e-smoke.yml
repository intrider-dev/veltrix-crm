name: e2e-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Production-like Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the production-like app and PostgreSQL
        run: docker compose up --build --detach postgres app

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color app postgres
          exit 1

      - name: Run Playwright smoke suite
        run: pnpm exec playwright test --trace=retain-on-failure

      - name: Capture Compose logs
        if: always()
        run: |
          mkdir -p test-results/compose
          docker compose logs --no-color app postgres > test-results/compose/compose.log 2>&1 || true

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke-evidence
          path: |
            playwright-report
            test-results
            docs/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the production-like environment
        if: always()
        run: docker compose down --volumes --remove-orphans
