name: build-production

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: SPA, Go binary, and hardened runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Build production artifacts and bundle report
        run: |
          mkdir -p dist
          pnpm build

      - name: Upload production build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-build
          path: |
            dist
            apps/web/dist
            benchmarks/results/bundle-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          push: false
          tags: veltrix-crm-ci:${{ github.sha }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

      - name: Verify runtime user, healthcheck, and Node.js absence
        run: |
          bash scripts/container-verify.sh "veltrix-crm-ci:${GITHUB_SHA}"
          container_id="$(docker create "veltrix-crm-ci:${GITHUB_SHA}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker export "${container_id}" | tar -tf - > runtime-files.txt
          if grep -Eiq '(^|/)(node|nodejs)(\.exe)?$' runtime-files.txt; then
            echo "Node.js executable found in runtime filesystem" >&2
            exit 1
          fi

      - name: Capture image metadata
        run: |
          docker image inspect "veltrix-crm-ci:${GITHUB_SHA}" > container-inspect.json
          docker history --no-trunc "veltrix-crm-ci:${GITHUB_SHA}" > container-history.txt

      - name: Upload image metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-metadata
          path: |
            container-inspect.json
            container-history.txt
            runtime-files.txt
          if-no-files-found: ignore
          retention-days: 14
