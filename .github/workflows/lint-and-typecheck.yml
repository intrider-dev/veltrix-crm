name: lint-and-typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and generated state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Regenerate contracts and catalogs
        run: pnpm generate:contracts

      - name: Verify generated files are committed
        run: git diff --exit-code -- .

      - name: Lint all workspaces
        run: pnpm lint

      - name: Typecheck the frontend
        run: pnpm typecheck
