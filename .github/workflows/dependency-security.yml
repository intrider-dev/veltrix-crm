name: dependency-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-audit:
    name: Go vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-project
        with:
          install-dependencies: "false"

      - name: Verify Go modules
        run: go -C apps/api mod verify

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./apps/api/... | tee govulncheck.txt

      - name: Upload Go vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-vulnerability-report
          path: govulncheck.txt
          if-no-files-found: ignore
          retention-days: 30

  frontend-audit:
    name: Frontend vulnerability and license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project
        id: setup
        uses: ./.github/actions/setup-project

      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high --json | tee pnpm-audit.json

      - name: Produce and enforce production license report
        if: always() && steps.setup.outcome == 'success'
        run: |
          pnpm licenses list --prod --json > license-report.json
          node .github/scripts/check-licenses.mjs license-report.json

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dependency-security-reports
          path: |
            pnpm-audit.json
            license-report.json
          if-no-files-found: ignore
          retention-days: 30
