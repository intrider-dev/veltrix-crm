name: container-scan

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "apps/**"
      - "packages/**"
      - "infra/container/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/container-scan.yml"
  push:
    branches: [main]
  schedule:
    - cron: "13 5 * * 3"

permissions:
  contents: read
  security-events: write

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: veltrix-crm-security

jobs:
  scan:
    name: Trivy image scan and SPDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local runtime image
        id: image-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=container-scan
          cache-to: type=gha,mode=max,scope=container-scan

      - name: Verify hardened runtime invariants
        run: |
          bash scripts/container-verify.sh "${IMAGE_NAME}:${GITHUB_SHA}"
          container_id="$(docker create "${IMAGE_NAME}:${GITHUB_SHA}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker export "${container_id}" | tar -tf - > runtime-files.txt
          if grep -Eiq '(^|/)(node|nodejs)(\.exe)?$' runtime-files.txt; then
            echo "Node.js executable found in runtime filesystem" >&2
            exit 1
          fi

      - name: Scan image for high and critical vulnerabilities
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 0.71.2
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          vuln-type: os,library

      - name: Generate SPDX JSON SBOM
        if: always() && steps.image-build.outcome == 'success'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload Trivy SARIF to code scanning
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload scan and SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-evidence
          path: |
            trivy-results.sarif
            sbom.spdx.json
            runtime-files.txt
          if-no-files-found: ignore
          retention-days: 30
