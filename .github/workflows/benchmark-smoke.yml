name: benchmark-smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Bounded k6 regression smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEMO_SEED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start constrained app and PostgreSQL
        run: docker compose up --build --detach postgres app

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color app postgres
          exit 1

      - name: Load deterministic small dataset
        run: docker compose run --rm --no-deps benchmark-seed seed --profile small

      - name: Run short k6 smoke profile
        run: |
          docker compose --profile benchmark run --rm --no-deps \
            -e BASE_URL=http://app:8080 \
            -e K6_PROFILE=baseline \
            -e K6_VUS=5 \
            -e K6_WARMUP=10s \
            -e K6_DURATION=30s \
            -e K6_RESULT_PATH=/benchmarks/results/k6-smoke.summary.json \
            benchmark

      - name: Capture resource and service evidence
        if: always()
        run: |
          mkdir -p benchmarks/results
          docker compose stats --no-stream app postgres > benchmarks/results/docker-stats-smoke.txt 2>&1 || true
          docker compose logs --no-color app postgres > benchmarks/results/compose-smoke.log 2>&1 || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-results
          path: benchmarks/results
          if-no-files-found: error
          retention-days: 14

      - name: Stop benchmark environment
        if: always()
        run: docker compose --profile benchmark down --volumes --remove-orphans
